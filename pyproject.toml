[project]
name = "raiseradar"
version = "0.1.0"
description = "Track recent Series B/C funding rounds and find which of those startups are hiring"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
raiseradar = "raiseradar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["raiseradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real network (deselect with -m 'not live')"]
